<h1>Click- Events</h1>
<p>Input Event</p>
<input (input)="onInput($event)" type= "text"  placeholder="Enter the text"/> 
<p>Key Up Event</p>
<input (keyup)="onKeyUp($event)" type= "text"  placeholder="Press any key"/>
<p>Hover Event</p>
<div (mouseover)="onHover($event)" (mouseleave)="onLeave($event)"   class="hover-box">
  Hover over me
</div>
<p>Blur Event on input tags</p>
<input (blur)="onBlur($event)" (focus)="onFocus($event)" type= "text"  placeholder="Go out of focus"/>
