<h1>Set-get alue in input tags</h1>
<!-- using event-binding and function -->
<input type="text" (input)="updateName($event.target.value)" placeholder="Enter your name"/>
<p>Your name is: {{name}}</p>

<!-- using event object -->
<input type="text" (input)="city=$event.target.value" placeholder="Enter city"/>
<p>Your city is: {{city}}</p>

<!-- use template refernce variable  -->
<input type="text" #emailRef placeholder="Enter mail"/>
<button (click)="getEmail(emailRef.value)">Get email</button>
<p>Your email is: {{email}}</p>
