<h1>Counter app</h1>

<div class="counter-class">
  <h1>{{counter()}}</h1>
  <div class="buttons">

    <button class="inc_btn" (click)="increament()">Increase</button>
    <button class="dec_btn" (click)="decreament()">Decrease</button>
    <button  class="res_btn" (click)="reset()">Reset</button>
  </div>
</div>
